<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>مكتبة البابا اثناسيوس</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        :root {
            --bg: #f4f5f7;
            --surface: #ffffff;
            --text: #222222;
            --text-muted: #777777;
            --text-faint: #888888;
            --border: #dddddd;
            --border-soft: #eeeeee;
            --accent: #007bff;
            --accent-soft: #cfe2ff;
            --shadow: rgba(0, 0, 0, 0.08);
        }

        html.dark-theme {
            --bg: #121316;
            --surface: #1e1f23;
            --text: #ececec;
            --text-muted: #a3a3a3;
            --text-faint: #8a8a8a;
            --border: #35363b;
            --border-soft: #2a2b2f;
            --accent: #4dabf7;
            --accent-soft: #294764;
            --shadow: rgba(0, 0, 0, 0.4);
        }

        body {
            font-family: "Cairo", "Segoe UI", Tahoma, Arial, sans-serif;
            background-color: var(--bg);
            padding: 0;
            direction: rtl;
            text-align: right;
            margin: 0;
            color: var(--text);
            font-size: 15px;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        /* Mobile-first: everything below is the small-screen baseline.
           Larger layouts are added later via min-width media queries. */

        .top-bar {
            position: sticky;
            top: 0;
            z-index: 500;
            background-color: var(--bg);
            padding: 12px 12px 10px;
            box-shadow: 0 2px 6px var(--shadow);
        }

        .top-bar-header {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .theme-toggle {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 50%;
            width: 38px;
            height: 38px;
            font-size: 17px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
        }

        .theme-toggle:active {
            border-color: var(--accent);
        }

        h2 {
            text-align: center;
            margin: 2px 0 14px;
            font-size: 17px;
            line-height: 1.5;
        }

        /* Search bar - stacked on mobile */
        .search-bar {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 700px;
            margin: 0 auto;
        }

        .controls-row {
            display: flex;
            gap: 8px;
            max-width: 700px;
            margin: 8px auto 0;
        }

        .search-bar select,
        .search-bar input,
        .controls-row select {
            padding: 13px 14px;
            /* 16px avoids iOS Safari auto-zoom on focus */
            font-size: 16px;
            border: 2px solid var(--border);
            border-radius: 10px;
            background-color: var(--surface);
            color: var(--text);
            outline: none;
            transition: border-color 0.2s ease;
            width: 100%;
        }

        .search-bar select,
        .controls-row select {
            cursor: pointer;
        }

        .search-bar select:focus,
        .search-bar input:focus,
        .controls-row select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.15);
        }

        .result-count {
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 8px;
        }

        /* Card grid - single column on mobile for easy thumb scanning */
        .card-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            max-width: 1200px;
            margin: 14px auto;
            padding: 0 12px 12px;
        }

        .book-card {
            background: var(--surface);
            border-radius: 12px;
            padding: 14px 16px;
            box-shadow: 0 1px 4px var(--shadow);
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.2s ease, border-color 0.2s ease;
            border: 1px solid var(--border-soft);
            min-height: 44px;
            /* comfortable tap target */
        }

        .book-card:active {
            transform: scale(0.98);
            box-shadow: 0 1px 2px var(--shadow);
            border-color: var(--accent-soft);
        }

        .book-card .book-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--text);
            margin-bottom: 4px;
            line-height: 1.4;
        }

        .book-card .book-author {
            font-size: 13px;
            color: var(--text-muted);
        }

        .no-results {
            text-align: center;
            color: var(--text-faint);
            padding: 40px 10px;
            grid-column: 1 / -1;
        }

        .scroll-sentinel {
            grid-column: 1 / -1;
            height: 1px;
        }

        /* Modal - bottom sheet on mobile */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.hidden {
            display: none;
        }

        .modal-box {
            background: var(--surface);
            border-radius: 18px 18px 0 0;
            max-width: 500px;
            width: 100%;
            max-height: 88vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 22px 18px calc(22px + env(safe-area-inset-bottom, 0px));
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 12px;
            left: 12px;
            background: var(--border-soft);
            border: none;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            font-size: 18px;
            cursor: pointer;
            color: var(--text);
        }

        .modal-close:active {
            background: var(--border);
        }

        .modal-title {
            font-size: 18px;
            font-weight: bold;
            margin: 0 0 16px;
            padding-left: 44px;
            line-height: 1.4;
            color: var(--text);
        }

        .detail-row {
            display: flex;
            flex-direction: column;
            gap: 3px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-soft);
            font-size: 14px;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: var(--text-faint);
            font-size: 12px;
        }

        .detail-value {
            font-weight: 600;
            color: var(--text);
            text-align: right;
        }

        /* Loading */
        .loading-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .loading-spinner {
            width: 44px;
            height: 44px;
            border: 4px solid var(--border-soft);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        .loading-text {
            margin-top: 16px;
            font-size: 15px;
            color: var(--text);
            font-weight: 600;
            text-align: center;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .hidden {
            display: none !important;
        }

        /* Small phones */
        @media (max-width: 360px) {
            h2 {
                font-size: 15px;
            }

            .book-card .book-title {
                font-size: 15px;
            }
        }

        /* Larger phones landscape / small tablets and up: two-column cards, inline search bar */
        @media (min-width: 600px) {
            .top-bar {
                padding: 16px 20px 14px;
            }

            h2 {
                font-size: 20px;
                margin-bottom: 18px;
            }

            .search-bar {
                flex-direction: row;
            }

            .search-bar select {
                flex: 0 0 160px;
            }

            .search-bar input {
                flex: 1;
                min-width: 0;
            }

            .controls-row {
                flex-direction: row;
            }

            .controls-row select {
                flex: 0 0 220px;
            }

            .card-grid {
                grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
                gap: 14px;
                padding: 0 20px 20px;
            }

            .book-card:hover {
                transform: translateY(-2px);
                box-shadow: 0 4px 12px var(--shadow);
                border-color: var(--accent-soft);
            }

            .modal-overlay {
                align-items: center;
                padding: 16px;
            }

            .modal-box {
                border-radius: 14px;
                max-height: 85vh;
                padding: 24px;
            }

            .detail-row {
                flex-direction: row;
                justify-content: space-between;
            }

            .detail-value {
                text-align: left;
            }
        }

        /* Tablets / desktop */
        @media (min-width: 1025px) {
            .card-grid {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            }
        }
    </style>
</head>

<body>

    <script>
        // Apply saved theme before first paint to avoid a light/dark flash
        try {
            if (localStorage.getItem('lib_theme') === 'dark') {
                document.documentElement.classList.add('dark-theme');
            }
        } catch (e) { }
    </script>

    <div id="loadingContainer" class="loading-container">
        <div>
            <div class="loading-spinner"></div>
            <div class="loading-text">جارٍ تحميل البيانات...</div>
        </div>
    </div>

    <div class="top-bar">
        <div class="top-bar-header">
            <h2>كنيسة القديسة دميانة بالهرم<br>مكتبة البابا اثناسيوس الرسولى</h2>
            <button class="theme-toggle" id="themeToggle" aria-label="تبديل المظهر">🌙</button>
        </div>

        <div class="search-bar">
            <select id="columnSelect"></select>
            <input type="text" id="searchInput" placeholder="ابحث...">
        </div>

        <div class="controls-row">
            <select id="sortSelect">
                <option value="default">الترتيب الافتراضي</option>
                <option value="title">ترتيب حسب العنوان</option>
                <option value="author">ترتيب حسب المؤلف</option>
                <option value="year">ترتيب حسب سنة النشر</option>
            </select>
        </div>

        <div class="result-count" id="resultCount"></div>
    </div>

    <div class="card-grid" id="cardGrid"></div>

    <div class="modal-overlay hidden" id="modalOverlay">
        <div class="modal-box">
            <button class="modal-close" id="modalClose">✕</button>
            <div class="modal-title" id="modalTitle"></div>
            <div id="modalDetails"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

    <script>
        const TITLE_FIELD = "اسم الكتاب";
        const AUTHOR_FIELD = "اسم المؤلف";
        const YEAR_FIELD = "سنة النشر";
        const ALL_COLUMNS_VALUE = "__ALL__";
        const PAGE_SIZE = 24;
        const STORAGE_KEY = "lib_search_state";
        const THEME_KEY = "lib_theme";

        let allRows = [];
        let headers = [];
        let currentRows = [];
        let renderedCount = 0;
        let scrollObserver = null;

        async function loadData() {
            if (location.protocol === 'file:') {
                document.getElementById('loadingContainer').innerHTML =
                    '<div style="max-width:320px;text-align:center;padding:0 16px;">' +
                    '<div style="font-size:15px;font-weight:600;color:var(--text);margin-bottom:8px;">' +
                    'لا يمكن تشغيل الصفحة بفتح الملف مباشرة' +
                    '</div>' +
                    '<div style="font-size:13px;color:var(--text-muted);">' +
                    'يرجى تشغيلها عبر خادم محلي (مثل Live Server) أو من خلال GitHub Pages.' +
                    '</div></div>';
                return;
            }

            try {
                const res = await fetch('data.csv');
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const csvText = await res.text();

                const parsed = Papa.parse(csvText, {
                    header: true,
                    skipEmptyLines: true
                });

                allRows = parsed.data;
                headers = Object.keys(allRows[0] || {});

                setupColumnDropdown();
                restoreSavedState();

                document.getElementById('cardGrid').addEventListener('click', (e) => {
                    const card = e.target.closest('.book-card');
                    if (!card) return;
                    const idx = parseInt(card.getAttribute('data-index'), 10);
                    openModal(currentRows[idx]);
                });

                refreshResults();

                const debouncedRefresh = debounce(refreshResults, 200);
                document.getElementById('searchInput').addEventListener('input', debouncedRefresh);
                document.getElementById('columnSelect').addEventListener('change', refreshResults);
                document.getElementById('sortSelect').addEventListener('change', refreshResults);

                document.getElementById('loadingContainer').classList.add('hidden');
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('loadingContainer').innerHTML =
                    '<div style="max-width:320px;text-align:center;padding:0 16px;">' +
                    '<div style="font-size:15px;font-weight:600;color:var(--text);margin-bottom:8px;">' +
                    'تعذر تحميل بيانات الكتب' +
                    '</div>' +
                    '<div style="font-size:13px;color:var(--text-muted);">' +
                    'تأكد من وجود ملف data.csv في نفس مجلد الصفحة، ثم أعد التحميل.' +
                    '</div></div>';
            }
        }

        function debounce(fn, delay) {
            let timer = null;
            return (...args) => {
                clearTimeout(timer);
                timer = setTimeout(() => fn(...args), delay);
            };
        }

        function setupColumnDropdown() {
            const select = document.getElementById('columnSelect');
            select.innerHTML = `<option value="${ALL_COLUMNS_VALUE}">كل الأعمدة</option>` +
                headers.map(h => `<option value="${h}">${h}</option>`).join("");
        }

        function restoreSavedState() {
            try {
                const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
                if (saved.query) document.getElementById('searchInput').value = saved.query;
                if (saved.column) document.getElementById('columnSelect').value = saved.column;
                if (saved.sort) document.getElementById('sortSelect').value = saved.sort;
            } catch (e) { }
        }

        function saveState(query, column, sort) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({ query, column, sort }));
            } catch (e) { }
        }

        function sortRows(rows, mode) {
            if (mode === 'title') {
                return [...rows].sort((a, b) => (a[TITLE_FIELD] || '').localeCompare(b[TITLE_FIELD] || '', 'ar'));
            }
            if (mode === 'author') {
                return [...rows].sort((a, b) => (a[AUTHOR_FIELD] || '').localeCompare(b[AUTHOR_FIELD] || '', 'ar'));
            }
            if (mode === 'year') {
                return [...rows].sort((a, b) => (parseInt(b[YEAR_FIELD]) || 0) - (parseInt(a[YEAR_FIELD]) || 0));
            }
            return rows;
        }

        function refreshResults() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const column = document.getElementById('columnSelect').value;
            const sortMode = document.getElementById('sortSelect').value;

            let filtered = allRows;
            if (query) {
                filtered = allRows.filter(row => {
                    if (column === ALL_COLUMNS_VALUE) {
                        return headers.some(h => (row[h] || '').toString().toLowerCase().includes(query));
                    }
                    return (row[column] || '').toString().toLowerCase().includes(query);
                });
            }

            renderCards(sortRows(filtered, sortMode));
            saveState(document.getElementById('searchInput').value, column, sortMode);
        }

        function renderCards(rows) {
            const grid = document.getElementById('cardGrid');
            currentRows = rows;
            renderedCount = 0;
            if (scrollObserver) scrollObserver.disconnect();
            grid.innerHTML = '';
            document.getElementById('resultCount').textContent = `عدد النتائج: ${rows.length}`;

            if (rows.length === 0) {
                grid.innerHTML = `<div class="no-results">لا توجد نتائج مطابقة</div>`;
                return;
            }

            loadNextChunk();
        }

        function loadNextChunk() {
            const grid = document.getElementById('cardGrid');

            const oldSentinel = document.getElementById('scrollSentinel');
            if (oldSentinel) oldSentinel.remove();

            const nextRows = currentRows.slice(renderedCount, renderedCount + PAGE_SIZE);
            const html = nextRows.map((row, i) => {
                const idx = renderedCount + i;
                const title = row[TITLE_FIELD] || 'بدون عنوان';
                const author = row[AUTHOR_FIELD] || '';
                return `<div class="book-card" data-index="${idx}">
                    <div class="book-title">${escapeHtml(title)}</div>
                    <div class="book-author">${escapeHtml(author)}</div>
                </div>`;
            }).join("");

            grid.insertAdjacentHTML('beforeend', html);
            renderedCount += nextRows.length;

            if (renderedCount < currentRows.length) {
                const sentinel = document.createElement('div');
                sentinel.id = 'scrollSentinel';
                sentinel.className = 'scroll-sentinel';
                grid.appendChild(sentinel);

                scrollObserver = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            scrollObserver.disconnect();
                            loadNextChunk();
                        }
                    });
                }, { rootMargin: '400px' });
                scrollObserver.observe(sentinel);
            }
        }

        function openModal(row) {
            const modal = document.getElementById('modalOverlay');
            document.getElementById('modalTitle').textContent = row[TITLE_FIELD] || 'تفاصيل الكتاب';

            const details = headers
                .filter(h => h !== TITLE_FIELD && (row[h] || '').toString().trim() !== '')
                .map(h => `<div class="detail-row">
                    <span class="detail-label">${escapeHtml(h)}</span>
                    <span class="detail-value">${escapeHtml(row[h])}</span>
                </div>`).join("");

            document.getElementById('modalDetails').innerHTML = details || '<div class="detail-row">لا توجد تفاصيل إضافية</div>';
            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.add('hidden');
        }

        document.getElementById('modalClose').addEventListener('click', closeModal);
        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target.id === 'modalOverlay') closeModal();
        });

        const themeToggleBtn = document.getElementById('themeToggle');
        function updateThemeIcon() {
            themeToggleBtn.textContent = document.documentElement.classList.contains('dark-theme') ? '☀️' : '🌙';
        }
        updateThemeIcon();
        themeToggleBtn.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark-theme');
            const isDark = document.documentElement.classList.contains('dark-theme');
            try { localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light'); } catch (e) { }
            updateThemeIcon();
        });

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        loadData();

        if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch((err) => {
                    console.error('Service worker registration failed:', err);
                });
            });
        }
    </script>
</body>

</html>
