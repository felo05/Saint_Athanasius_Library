<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>قاعدة بيانات الكتب</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="فهرس كتب مكتبة البابا أثناسيوس الرسولي - كنيسة القديسة دميانة بالهرم">
    <meta name="theme-color" content="#1f3a5f">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="المكتبة">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        :root {
            --bg: #f4f5f7;
            --surface: #ffffff;
            --text: #222222;
            --text-muted: #777777;
            --text-faint: #888888;
            --border: #dddddd;
            --border-soft: #eeeeee;
            --accent: #007bff;
            --accent-soft: #cfe2ff;
            --shadow: rgba(0, 0, 0, 0.08);
        }

        html.dark-theme {
            --bg: #121316;
            --surface: #1e1f23;
            --text: #ececec;
            --text-muted: #a3a3a3;
            --text-faint: #8a8a8a;
            --border: #35363b;
            --border-soft: #2a2b2f;
            --accent: #4dabf7;
            --accent-soft: #294764;
            --shadow: rgba(0, 0, 0, 0.4);
        }

        body {
            font-family: "Cairo", "Segoe UI", Tahoma, Arial, sans-serif;
            background-color: var(--bg);
            padding: 0;
            direction: rtl;
            text-align: right;
            margin: 0;
            color: var(--text);
            font-size: 15px;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        /* Mobile-first: everything below is the small-screen baseline.
           Larger layouts are added later via min-width media queries. */

        .top-bar {
            position: sticky;
            top: 0;
            z-index: 500;
            background-color: var(--bg);
            padding: 12px 12px 10px;
            box-shadow: 0 2px 6px var(--shadow);
        }

        .top-bar-header {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .theme-toggle {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 50%;
            width: 38px;
            height: 38px;
            font-size: 17px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
        }

        .theme-toggle:active {
            border-color: var(--accent);
        }

        .stats-toggle {
            left: auto;
            right: 0;
        }

        h2 {
            text-align: center;
            margin: 2px 0 14px;
            padding: 0 44px;
            font-size: 17px;
            line-height: 1.5;
        }

        /* Search bar - just the text input */
        .search-bar {
            display: flex;
            max-width: 700px;
            margin: 0 auto;
        }

        /* Column filter + sort dropdowns, side by side */
        .controls-row {
            display: flex;
            gap: 8px;
            max-width: 700px;
            margin: 8px auto 0;
        }

        .controls-row select {
            flex: 1;
            min-width: 0;
        }

        .search-bar input,
        .controls-row select {
            padding: 13px 14px;
            /* 16px avoids iOS Safari auto-zoom on focus */
            font-size: 16px;
            border: 2px solid var(--border);
            border-radius: 10px;
            background-color: var(--surface);
            color: var(--text);
            outline: none;
            transition: border-color 0.2s ease;
            width: 100%;
        }

        .controls-row select {
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            padding-left: 44px;
            background-repeat: no-repeat;
            background-position: left 16px center;
            background-size: 15px;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23888888' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'%3E%3C/polyline%3E%3C/svg%3E");
        }

        .search-bar input:focus,
        .controls-row select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.15);
        }

        .result-count {
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 8px;
        }

        /* Card grid - single column on mobile for easy thumb scanning */
        .card-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            max-width: 1200px;
            margin: 14px auto;
            padding: 0 12px 12px;
        }

        .book-card {
            background: var(--surface);
            border-radius: 12px;
            padding: 14px 16px;
            box-shadow: 0 1px 4px var(--shadow);
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.2s ease, border-color 0.2s ease;
            border: 1px solid var(--border-soft);
            min-height: 44px;
            /* comfortable tap target */
        }

        .book-card:active {
            transform: scale(0.98);
            box-shadow: 0 1px 2px var(--shadow);
            border-color: var(--accent-soft);
        }

        .book-card .book-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--text);
            margin-bottom: 4px;
            line-height: 1.4;
        }

        .book-card .book-author {
            font-size: 13px;
            color: var(--text-muted);
        }

        .no-results {
            text-align: center;
            color: var(--text-faint);
            padding: 40px 10px;
            grid-column: 1 / -1;
        }

        .scroll-sentinel {
            grid-column: 1 / -1;
            height: 1px;
        }

        /* Modal - bottom sheet on mobile */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.hidden {
            display: none;
        }

        .modal-box {
            background: var(--surface);
            border-radius: 18px 18px 0 0;
            max-width: 500px;
            width: 100%;
            max-height: 88vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 22px 18px calc(22px + env(safe-area-inset-bottom, 0px));
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 12px;
            left: 12px;
            background: var(--border-soft);
            border: none;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            font-size: 18px;
            cursor: pointer;
            color: var(--text);
        }

        .modal-close:active {
            background: var(--border);
        }

        .modal-title {
            font-size: 18px;
            font-weight: bold;
            margin: 0 0 16px;
            padding-left: 44px;
            line-height: 1.4;
            color: var(--text);
        }

        .detail-row {
            display: flex;
            flex-direction: column;
            gap: 3px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-soft);
            font-size: 14px;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: var(--text-faint);
            font-size: 12px;
        }

        .detail-value {
            font-weight: 600;
            color: var(--text);
            text-align: right;
        }

        /* Tappable values (author, series, ...) that open all matching books */
        .detail-link {
            font: inherit;
            font-weight: 600;
            color: var(--accent);
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            text-align: inherit;
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        .detail-link::after {
            content: " ←";
            text-decoration: none;
            display: inline-block;
            margin-right: 4px;
        }

        .search-bar {
            position: relative;
        }

        .search-bar input {
            padding-left: 44px;
        }

        .search-bar input[type="search"] {
            -webkit-appearance: none;
            appearance: none;
        }

        .search-bar input[type="search"]::-webkit-search-cancel-button {
            display: none;
        }

        .search-clear {
            position: absolute;
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 50%;
            background: var(--border-soft);
            color: var(--text-muted);
            font-size: 14px;
            cursor: pointer;
        }

        /* Loading */
        .loading-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .loading-spinner {
            width: 44px;
            height: 44px;
            border: 4px solid var(--border-soft);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        .loading-text {
            margin-top: 16px;
            font-size: 15px;
            color: var(--text);
            font-weight: 600;
            text-align: center;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .hidden {
            display: none !important;
        }

        /* Statistics page - full-screen panel */
        .stats-overlay {
            position: fixed;
            inset: 0;
            z-index: 1100;
            background: var(--bg);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .stats-header {
            position: sticky;
            top: 0;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            padding: 14px 12px;
            box-shadow: 0 2px 6px var(--shadow);
        }

        .stats-header h3 {
            margin: 0;
            font-size: 18px;
        }

        .stats-header .modal-close {
            top: 50%;
            transform: translateY(-50%);
        }

        .stats-body {
            max-width: 900px;
            margin: 0 auto;
            padding: 14px 12px calc(24px + env(safe-area-inset-bottom, 0px));
        }

        .stat-tiles {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 14px;
        }

        .stat-tile {
            background: var(--surface);
            border: 1px solid var(--border-soft);
            border-radius: 12px;
            padding: 12px 14px;
        }

        .stat-tile .stat-value {
            font-size: 24px;
            font-weight: 800;
            color: var(--text);
            font-variant-numeric: tabular-nums;
        }

        .stat-tile .stat-label {
            font-size: 13px;
            color: var(--text-muted);
        }

        .stats-sections {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
        }

        .stats-section {
            background: var(--surface);
            border: 1px solid var(--border-soft);
            border-radius: 12px;
            padding: 14px 16px 8px;
        }

        .stats-section h4 {
            margin: 0 0 2px;
            font-size: 16px;
        }

        .stats-section .stats-note {
            font-size: 12px;
            color: var(--text-faint);
            margin-bottom: 8px;
        }

        /* One ranked bar per row: label + count, thin bar underneath */
        .bar-row {
            display: block;
            width: 100%;
            font: inherit;
            text-align: right;
            background: none;
            border: none;
            border-radius: 8px;
            padding: 7px 4px;
            margin: 0 -4px;
            color: var(--text);
            box-sizing: content-box;
        }

        button.bar-row {
            cursor: pointer;
        }

        button.bar-row:hover,
        button.bar-row:focus-visible {
            background: var(--border-soft);
            outline: none;
        }

        .bar-label {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .bar-label .bar-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .bar-label .bar-count {
            color: var(--text-muted);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            flex-shrink: 0;
        }

        .bar-track {
            height: 8px;
            border-radius: 4px;
            background: var(--border-soft);
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            min-width: 2px;
            border-radius: 4px;
            background: var(--accent);
        }

        @media (min-width: 600px) {
            .stat-tiles {
                grid-template-columns: repeat(4, 1fr);
            }

            .stats-sections {
                grid-template-columns: 1fr 1fr;
            }
        }

        /* Small phones */
        @media (max-width: 360px) {
            h2 {
                font-size: 15px;
            }

            .book-card .book-title {
                font-size: 15px;
            }
        }

        /* Larger phones landscape / small tablets and up: two-column cards, inline search bar */
        @media (min-width: 600px) {
            .top-bar {
                padding: 16px 20px 14px;
            }

            h2 {
                font-size: 20px;
                margin-bottom: 18px;
            }

            .controls-row {
                flex-direction: row;
            }

            .controls-row select {
                flex: 0 0 220px;
            }

            .card-grid {
                grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
                gap: 14px;
                padding: 0 20px 20px;
            }

            .book-card:hover {
                transform: translateY(-2px);
                box-shadow: 0 4px 12px var(--shadow);
                border-color: var(--accent-soft);
            }

            .modal-overlay {
                align-items: center;
                padding: 16px;
            }

            .modal-box {
                border-radius: 14px;
                max-height: 85vh;
                padding: 24px;
            }

            .detail-row {
                flex-direction: row;
                justify-content: space-between;
            }

            .detail-value {
                text-align: left;
            }
        }

        /* Tablets / desktop */
        @media (min-width: 1025px) {
            .card-grid {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            }
        }
    </style>
</head>

<body>

    <script>
        // Apply saved theme before first paint to avoid a light/dark flash
        try {
            if (localStorage.getItem('lib_theme') === 'dark') {
                document.documentElement.classList.add('dark-theme');
            }
        } catch (e) { }
    </script>

    <div id="loadingContainer" class="loading-container">
        <div>
            <div class="loading-spinner"></div>
            <div class="loading-text">جارٍ تحميل البيانات...</div>
        </div>
    </div>

    <div class="top-bar">
        <div class="top-bar-header">
            <h2>كنيسة القديسة دميانة بالهرم<br>مكتبة البابا اثناسيوس الرسولى</h2>
            <button class="theme-toggle stats-toggle" id="statsOpen" aria-label="إحصائيات المكتبة" title="إحصائيات المكتبة">📊</button>
            <button class="theme-toggle" id="themeToggle" aria-label="تبديل المظهر">🌙</button>
        </div>

        <div class="search-bar">
            <input type="search" id="searchInput" placeholder="ابحث..." enterkeyhint="search" autocomplete="off">
            <button class="search-clear hidden" id="searchClear" aria-label="مسح البحث">✕</button>
        </div>

        <div class="controls-row">
            <select id="columnSelect"></select>
            <select id="sortSelect">
                <option value="default">الترتيب الافتراضي</option>
                <option value="title">ترتيب حسب العنوان</option>
                <option value="author">ترتيب حسب المؤلف</option>
                <option value="year">ترتيب حسب سنة النشر</option>
            </select>
        </div>

        <div class="result-count" id="resultCount"></div>
    </div>

    <div class="card-grid" id="cardGrid"></div>

    <div class="modal-overlay hidden" id="modalOverlay">
        <div class="modal-box">
            <button class="modal-close" id="modalClose">✕</button>
            <div class="modal-title" id="modalTitle"></div>
            <div id="modalDetails"></div>
        </div>
    </div>

    <div class="stats-overlay hidden" id="statsOverlay" role="dialog" aria-labelledby="statsTitle">
        <div class="stats-header">
            <h3 id="statsTitle">إحصائيات المكتبة</h3>
            <button class="modal-close" id="statsClose" aria-label="إغلاق">✕</button>
        </div>
        <div class="stats-body" id="statsBody"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

    <script>
        const TITLE_FIELD = "اسم الكتاب";
        const AUTHOR_FIELD = "اسم المؤلف";
        const YEAR_FIELD = "سنة النشر";
        const ALL_COLUMNS_VALUE = "__ALL__";
        const PAGE_SIZE = 24;
        const STORAGE_KEY = "lib_search_state";
        const THEME_KEY = "lib_theme";
        // Fields shown as tappable links in the book details: tapping one
        // lists every book with the same author / series / publisher...
        const BROWSABLE_FIELDS = ["اسم المؤلف", "اسم المترجم", "السلسلة", "الناشر", "تصنيف الكتاب"];

        let allRows = [];
        let headers = [];
        // normIndex[i][j] = normalized text of allRows[i][headers[j]], built once
        // so searching doesn't re-normalize 7000+ rows on every keystroke.
        let normIndex = [];
        // Location-number columns: still shown in book details, but not searchable
        const NOT_SEARCHABLE = ["م. رف", "م. مجموعة", "م. التصنيف"];
        let modalRow = null;

        // Make Arabic search forgiving: ignore diacritics/tatweel and treat
        // common spelling variants as the same letter.
        function normalizeArabic(value) {
            return String(value || '')
                .toLowerCase()
                .replace(/[ً-ٰٟـ]/g, '')   // tashkeel, superscript alef, tatweel
                .replace(/[أإآٱ]/g, 'ا')
                .replace(/ة/g, 'ه')
                .replace(/ى/g, 'ي')
                .replace(/ؤ/g, 'و')
                .replace(/ئ/g, 'ي')
                .replace(/[٠-٩]/g, (d) => String(d.charCodeAt(0) - 0x0660)) // Arabic-Indic digits
                .replace(/\s+/g, ' ')
                .trim();
        }

        // CSV headers contain line breaks (e.g. "سنة\nالنشر"); turn them into spaces.
        function cleanHeader(h) {
            return h.replace(/^﻿/, '').replace(/\s+/g, ' ').trim();
        }
        let currentRows = [];
        let renderedCount = 0;
        let scrollObserver = null;

        async function loadData() {
            if (location.protocol === 'file:') {
                document.getElementById('loadingContainer').innerHTML =
                    '<div style="max-width:320px;text-align:center;padding:0 16px;">' +
                    '<div style="font-size:15px;font-weight:600;color:var(--text);margin-bottom:8px;">' +
                    'لا يمكن تشغيل الصفحة بفتح الملف مباشرة' +
                    '</div>' +
                    '<div style="font-size:13px;color:var(--text-muted);">' +
                    'يرجى تشغيلها عبر خادم محلي (مثل Live Server) أو من خلال GitHub Pages.' +
                    '</div></div>';
                return;
            }

            try {
                const res = await fetch('data.csv');
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const csvText = await res.text();

                const parsed = Papa.parse(csvText, {
                    header: true,
                    skipEmptyLines: true,
                    transformHeader: cleanHeader
                });

                allRows = parsed.data;
                headers = (parsed.meta.fields || Object.keys(allRows[0] || {})).filter(h => h);
                normIndex = allRows.map(row => headers.map(h =>
                    NOT_SEARCHABLE.includes(h) ? '' : normalizeArabic(row[h])));

                setupColumnDropdown();
                restoreSavedState();

                document.getElementById('cardGrid').addEventListener('click', (e) => {
                    const card = e.target.closest('.book-card');
                    if (!card) return;
                    const idx = parseInt(card.getAttribute('data-index'), 10);
                    openModal(currentRows[idx]);
                });

                refreshResults();

                const debouncedRefresh = debounce(refreshResults, 200);
                document.getElementById('searchInput').addEventListener('input', () => {
                    updateClearButton();
                    debouncedRefresh();
                });
                document.getElementById('searchClear').addEventListener('click', () => {
                    const input = document.getElementById('searchInput');
                    input.value = '';
                    document.getElementById('columnSelect').value = ALL_COLUMNS_VALUE;
                    updateClearButton();
                    refreshResults();
                    input.focus();
                });
                updateClearButton();
                document.getElementById('columnSelect').addEventListener('change', refreshResults);
                document.getElementById('sortSelect').addEventListener('change', refreshResults);

                document.getElementById('loadingContainer').classList.add('hidden');
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('loadingContainer').innerHTML =
                    '<div style="max-width:320px;text-align:center;padding:0 16px;">' +
                    '<div style="font-size:15px;font-weight:600;color:var(--text);margin-bottom:8px;">' +
                    'تعذر تحميل بيانات الكتب' +
                    '</div>' +
                    '<div style="font-size:13px;color:var(--text-muted);">' +
                    'تأكد من وجود ملف data.csv في نفس مجلد الصفحة، ثم أعد التحميل.' +
                    '</div></div>';
            }
        }

        function debounce(fn, delay) {
            let timer = null;
            return (...args) => {
                clearTimeout(timer);
                timer = setTimeout(() => fn(...args), delay);
            };
        }

        function setupColumnDropdown() {
            const select = document.getElementById('columnSelect');
            select.innerHTML = `<option value="${ALL_COLUMNS_VALUE}">كل الأعمدة</option>` +
                headers.filter(h => !NOT_SEARCHABLE.includes(h))
                    .map(h => `<option value="${h}">${h}</option>`).join("");
        }

        function restoreSavedState() {
            try {
                const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
                if (saved.query) document.getElementById('searchInput').value = saved.query;
                const columnSelect = document.getElementById('columnSelect');
                if (saved.column) columnSelect.value = cleanHeader(saved.column);
                if (columnSelect.selectedIndex < 0) columnSelect.value = ALL_COLUMNS_VALUE;
                if (saved.sort) document.getElementById('sortSelect').value = saved.sort;
            } catch (e) { }
        }

        function saveState(query, column, sort) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({ query, column, sort }));
            } catch (e) { }
        }

        function sortRows(rows, mode) {
            if (mode === 'title') {
                return [...rows].sort((a, b) => (a[TITLE_FIELD] || '').localeCompare(b[TITLE_FIELD] || '', 'ar'));
            }
            if (mode === 'author') {
                return [...rows].sort((a, b) => (a[AUTHOR_FIELD] || '').localeCompare(b[AUTHOR_FIELD] || '', 'ar'));
            }
            if (mode === 'year') {
                // Newest first; missing or invalid years (typos like "19962") go last.
                const year = (row) => {
                    const y = parseInt(normalizeArabic(row[YEAR_FIELD]), 10);
                    return y >= 1000 && y <= 2100 ? y : 0;
                };
                return [...rows].sort((a, b) => year(b) - year(a));
            }
            return rows;
        }

        function updateClearButton() {
            const hasText = document.getElementById('searchInput').value !== '';
            document.getElementById('searchClear').classList.toggle('hidden', !hasText);
        }

        function refreshResults() {
            const query = normalizeArabic(document.getElementById('searchInput').value);
            const column = document.getElementById('columnSelect').value;
            const sortMode = document.getElementById('sortSelect').value;

            // Every word must match, in any order (and, for "all columns",
            // in any column): "تفسير شنوده" finds "البابا شنوده ... تفسير".
            let filtered = allRows;
            const words = query ? query.split(' ') : [];
            if (words.length) {
                const colIdx = headers.indexOf(column);
                filtered = allRows.filter((row, i) => {
                    const norm = normIndex[i];
                    if (colIdx === -1) return words.every(w => norm.some(v => v.includes(w)));
                    return words.every(w => norm[colIdx].includes(w));
                });
            }

            renderCards(sortRows(filtered, sortMode));
            saveState(document.getElementById('searchInput').value, column, sortMode);
        }

        function renderCards(rows) {
            const grid = document.getElementById('cardGrid');
            currentRows = rows;
            renderedCount = 0;
            if (scrollObserver) scrollObserver.disconnect();
            grid.innerHTML = '';
            document.getElementById('resultCount').textContent = `عدد النتائج: ${rows.length}`;

            if (rows.length === 0) {
                grid.innerHTML = `<div class="no-results">لا توجد نتائج مطابقة</div>`;
                return;
            }

            loadNextChunk();
        }

        function loadNextChunk() {
            const grid = document.getElementById('cardGrid');

            const oldSentinel = document.getElementById('scrollSentinel');
            if (oldSentinel) oldSentinel.remove();

            const nextRows = currentRows.slice(renderedCount, renderedCount + PAGE_SIZE);
            const html = nextRows.map((row, i) => {
                const idx = renderedCount + i;
                const title = row[TITLE_FIELD] || 'بدون عنوان';
                const author = row[AUTHOR_FIELD] || '';
                return `<div class="book-card" data-index="${idx}">
                    <div class="book-title">${escapeHtml(title)}</div>
                    <div class="book-author">${escapeHtml(author)}</div>
                </div>`;
            }).join("");

            grid.insertAdjacentHTML('beforeend', html);
            renderedCount += nextRows.length;

            if (renderedCount < currentRows.length) {
                const sentinel = document.createElement('div');
                sentinel.id = 'scrollSentinel';
                sentinel.className = 'scroll-sentinel';
                grid.appendChild(sentinel);

                scrollObserver = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            scrollObserver.disconnect();
                            loadNextChunk();
                        }
                    });
                }, { rootMargin: '400px' });
                scrollObserver.observe(sentinel);
            }
        }

        function openModal(row) {
            modalRow = row;
            const modal = document.getElementById('modalOverlay');
            document.getElementById('modalTitle').textContent = row[TITLE_FIELD] || 'تفاصيل الكتاب';

            const details = headers
                .filter(h => h !== TITLE_FIELD && (row[h] || '').toString().trim() !== '')
                .map(h => {
                    const value = BROWSABLE_FIELDS.includes(h)
                        ? `<button type="button" class="detail-link" data-field="${headers.indexOf(h)}"
                               title="عرض كل الكتب: ${escapeHtml(row[h])}">${escapeHtml(row[h])}</button>`
                        : `<span class="detail-value">${escapeHtml(row[h])}</span>`;
                    return `<div class="detail-row">
                        <span class="detail-label">${escapeHtml(h)}</span>
                        ${value}
                    </div>`;
                }).join("");

            document.getElementById('modalDetails').innerHTML = details || '<div class="detail-row">لا توجد تفاصيل إضافية</div>';
            modal.classList.remove('hidden');
        }

        // Tap an author / series / publisher in the details to list all their books
        document.getElementById('modalDetails').addEventListener('click', (e) => {
            const link = e.target.closest('.detail-link');
            if (!link || !modalRow) return;
            const field = headers[parseInt(link.getAttribute('data-field'), 10)];
            closeModal();
            browseTo(field, modalRow[field]);
        });

        // Show every book whose `field` matches `value` (used by the book
        // details links and the statistics page).
        function browseTo(field, rawValue) {
            const value = (rawValue || '').toString().trim();
            if (!headers.includes(field) || !value) return;

            document.getElementById('columnSelect').value = field;
            document.getElementById('searchInput').value = value;
            if (document.getElementById('sortSelect').value === 'default') {
                document.getElementById('sortSelect').value = 'title';
            }
            updateClearButton();
            refreshResults();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ---------- Statistics page ----------
        const CATEGORY_LETTER_FIELD = "التصنيف";
        const CATEGORY_FIELD = "تصنيف الكتاب";
        const PUBLISHER_FIELD = "الناشر";
        const SERIES_FIELD = "السلسلة";
        const TRANSLATOR_FIELD = "اسم المترجم";
        let statsBuilt = false;

        // Count values of a field. Spelling variants (شنوده / شنودة) are counted
        // together; the most common spelling is the one displayed.
        function countField(field) {
            const groups = new Map();
            allRows.forEach(row => {
                const raw = (row[field] || '').toString().replace(/\s+/g, ' ').trim();
                if (!raw) return;
                const key = normalizeArabic(raw);
                let g = groups.get(key);
                if (!g) groups.set(key, g = { count: 0, spellings: new Map() });
                g.count++;
                g.spellings.set(raw, (g.spellings.get(raw) || 0) + 1);
            });
            return [...groups.values()]
                .map(g => ({
                    label: [...g.spellings.entries()].sort((a, b) => b[1] - a[1])[0][0],
                    count: g.count
                }))
                .sort((a, b) => b.count - a.count);
        }

        function barList(items, field) {
            const max = Math.max(...items.map(i => i.count), 1);
            return items.map(item => {
                const tag = field ? 'button' : 'div';
                const attrs = field
                    ? ` type="button" data-field="${headers.indexOf(field)}" data-value="${escapeHtml(item.label)}"
                        title="عرض الكتب: ${escapeHtml(item.label)}"`
                    : '';
                return `<${tag} class="bar-row"${attrs}>
                    <div class="bar-label">
                        <span class="bar-name">${escapeHtml(item.label)}</span>
                        <span class="bar-count">${item.count.toLocaleString('ar-EG')}</span>
                    </div>
                    <div class="bar-track"><div class="bar-fill" style="width:${(item.count / max * 100).toFixed(1)}%"></div></div>
                </${tag}>`;
            }).join('');
        }

        function statsSection(title, note, items, field) {
            if (!items.length) return '';
            return `<section class="stats-section">
                <h4>${title}</h4>
                <div class="stats-note">${note}</div>
                ${barList(items, field)}
            </section>`;
        }

        function buildStats() {
            const fmt = n => n.toLocaleString('ar-EG');
            const authors = countField(AUTHOR_FIELD);
            const publishers = countField(PUBLISHER_FIELD);
            const series = countField(SERIES_FIELD);
            const categories = countField(CATEGORY_FIELD);
            const translated = allRows.filter(r => (r[TRANSLATOR_FIELD] || '').trim()).length;

            const letters = countField(CATEGORY_LETTER_FIELD)
                .sort((a, b) => a.label.localeCompare(b.label, 'ar'));

            // Books per decade, in time order; invalid years are skipped
            const decades = new Map();
            allRows.forEach(row => {
                const y = parseInt(normalizeArabic(row[YEAR_FIELD]), 10);
                if (!(y >= 1000 && y <= 2100)) return;
                const d = Math.floor(y / 10) * 10;
                decades.set(d, (decades.get(d) || 0) + 1);
            });
            const decadeItems = [...decades.entries()]
                .sort((a, b) => b[0] - a[0])
                // \u2066...\u2069 keeps "1990–1999" left-to-right inside the Arabic layout
                .map(([d, count]) => ({ label: `\u2066${d}–${d + 9}\u2069`, count }));

            const tiles = [
                [fmt(allRows.length), 'كتاب'],
                [fmt(authors.length), 'مؤلف'],
                [fmt(publishers.length), 'ناشر'],
                [fmt(translated), 'كتاب مترجم']
            ].map(([v, l]) => `<div class="stat-tile"><div class="stat-value">${v}</div><div class="stat-label">${l}</div></div>`).join('');

            const tapNote = 'اضغط على أي اسم لعرض كتبه';
            document.getElementById('statsBody').innerHTML =
                `<div class="stat-tiles">${tiles}</div>
                <div class="stats-sections">
                    ${statsSection('أكثر المؤلفين كتبًا', tapNote, authors.slice(0, 10), AUTHOR_FIELD)}
                    ${statsSection('أكثر التصنيفات', tapNote, categories.slice(0, 10), CATEGORY_FIELD)}
                    ${statsSection('أكثر الناشرين', tapNote, publishers.slice(0, 10), PUBLISHER_FIELD)}
                    ${statsSection('أكبر السلاسل', tapNote, series.slice(0, 10), SERIES_FIELD)}
                    ${statsSection('الكتب حسب التصنيف (الحرف)', tapNote, letters, CATEGORY_LETTER_FIELD)}
                    ${statsSection('الكتب حسب عقد النشر', 'الأحدث أولًا', decadeItems, null)}
                </div>`;
            statsBuilt = true;
        }

        function openStats() {
            if (!allRows.length) return;
            if (!statsBuilt) buildStats();
            const overlay = document.getElementById('statsOverlay');
            overlay.classList.remove('hidden');
            overlay.scrollTop = 0;
            document.body.style.overflow = 'hidden';
        }

        function closeStats() {
            document.getElementById('statsOverlay').classList.add('hidden');
            document.body.style.overflow = '';
        }

        document.getElementById('statsOpen').addEventListener('click', openStats);
        document.getElementById('statsClose').addEventListener('click', closeStats);
        document.getElementById('statsBody').addEventListener('click', (e) => {
            const row = e.target.closest('button.bar-row');
            if (!row) return;
            closeStats();
            browseTo(headers[parseInt(row.getAttribute('data-field'), 10)], row.getAttribute('data-value'));
        });

        function closeModal() {
            document.getElementById('modalOverlay').classList.add('hidden');
        }

        document.getElementById('modalClose').addEventListener('click', closeModal);
        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target.id === 'modalOverlay') closeModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') { closeModal(); closeStats(); }
        });

        const themeToggleBtn = document.getElementById('themeToggle');
        function updateThemeIcon() {
            themeToggleBtn.textContent = document.documentElement.classList.contains('dark-theme') ? '☀️' : '🌙';
        }
        updateThemeIcon();
        themeToggleBtn.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark-theme');
            const isDark = document.documentElement.classList.contains('dark-theme');
            try { localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light'); } catch (e) { }
            updateThemeIcon();
        });

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        loadData();

        if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch((err) => {
                    console.error('Service worker registration failed:', err);
                });
            });
        }
    </script>
</body>
